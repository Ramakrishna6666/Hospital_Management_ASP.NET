version: '3.8'

services:
  clinicmanagementsystem:
    image: clinicmanagementsystem:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clinicmanagementsystem-app
    ports:
      - "8080:80"
    environment:
      - ASPNET_ENVIRONMENT=Production
      - DB_CONNECTION_STRING=Data Source=host.docker.internal;Initial Catalog=DBProject;User ID=sa;Password=YourPassword
      - REDIS_CONNECTION_STRING=host.docker.internal:6379
    networks:
      - clinic-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "powershell", "-command", "try { $response = Invoke-WebRequest -Uri http://localhost/Helpers/HealthCheckHandler.ashx -UseBasicParsing -TimeoutSec 5; if ($response.StatusCode -eq 200) { exit 0 } else { exit 1 } } catch { exit 1 }"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - app-logs:/inetpub/logs

networks:
  clinic-network:
    driver: bridge

volumes:
  app-logs:
    driver: local
